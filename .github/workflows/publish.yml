name: publish
on:
  workflow_dispatch:
  push:
    tags: ['browser-llm-nexus-v*']

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC) — no tokens

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: no registry-url here — setup-node's .npmrc/_authToken placeholder
      # would override the OIDC exchange and break trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure npm with OIDC support
        run: npm install -g npm@latest && npm --version
      - name: Test
        working-directory: libs/browser-llm-nexus
        run: |
          npm ci
          npm test
      - name: Publish (OIDC trusted publishing)
        working-directory: libs/browser-llm-nexus
        run: npm publish --access public
      - name: Confirm on registry
        run: |
          sleep 10
          npm view browser-llm-nexus version
