name: publish
on:
  workflow_dispatch:
  push:
    tags: ['browser-llm-nexus-v*']

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC) — no tokens

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm with OIDC support
        run: npm install -g npm@latest && npm --version
      - name: Test
        working-directory: libs/browser-llm-nexus
        run: |
          npm ci
          npm test
      - name: Publish (OIDC trusted publishing)
        working-directory: libs/browser-llm-nexus
        run: npm publish --access public
