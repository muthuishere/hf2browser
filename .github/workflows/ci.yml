name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go build + vet + test
        working-directory: apps/converter
        run: |
          go build ./...
          go vet ./...
          go test ./...

  nexus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build + test browser-llm-nexus
        working-directory: libs/browser-llm-nexus
        run: |
          npm ci
          npm test
