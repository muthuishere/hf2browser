name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go build + vet + test
        working-directory: apps/converter
        run: |
          go build ./...
          go vet ./...
          go test ./...
