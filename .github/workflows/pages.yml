name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build site + library bundle
        run: |
          cd libs/browser-llm-nexus && npm ci && npm run build && cd ../..
          mkdir -p _site/browser-llm-nexus
          cp site/index.html _site/index.html
          cp -r libs/browser-llm-nexus/dist/* _site/browser-llm-nexus/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
