version: '3'

# Four tasks. Everything else is a subcommand of the binary itself —
# `hf2browser search|check|convert|verify|serve|init|where` — so there is no
# second vocabulary to learn and no wrapper to keep in sync.

tasks:
  default:
    desc: "Same as `task up`"
    cmds:
      - task: up

  up:
    desc: "THE one command: build, serve, open the browser"
    deps: [build]
    dir: apps/converter
    cmds:
      - ./bin/hf2browser serve

  build:
    desc: Build the single binary (pipeline, verifier and demo are compiled in)
    dir: apps/converter
    cmds:
      - go build -o bin/hf2browser ./cmd/hf2browser
      - 'echo "built apps/converter/bin/hf2browser — run it from anywhere"'

  test:
    desc: Run the Go test suite
    dir: apps/converter
    cmds:
      - go test ./...

  dist:
    desc: Cross-compile release binaries into dist/
    dir: apps/converter
    vars:
      TARGETS: darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64
    cmds:
      - rm -rf dist && mkdir -p dist
      - for: { var: TARGETS, split: ' ' }
        cmd: |
          os="${ITEM%/*}"; arch="${ITEM#*/}"
          ext=""; [ "$os" = "windows" ] && ext=".exe"
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o "dist/hf2browser-$os-$arch$ext" ./cmd/hf2browser
      - ls -lh dist

  clean:
    desc: Remove build outputs and converted models
    cmds:
      - rm -rf apps/converter/bin apps/converter/dist apps/converter/models/*
